# HTTP identification.
#
# The Server header is the primary product signal. The header anchor accepts
# a real CR/LF as well as the literal escape text "\r"/"\n" that appears when
# scanners serialise binary banners into JSON without decoding them.
rules:
  - id: http-nginx
    description: nginx; parenthesised platform becomes os_hint.
    protocol: HTTP
    product: nginx
    version: '${version}'
    os_hint: '${os}'
    confidence: 0.9
    priority: 200
    match:
      - type: regex
        pattern: '(?i)(?:^|[\r\n]|\\[rn])Server:\s*nginx/(?P<version>[0-9][0-9A-Za-z._+-]*)(?:\s*\((?P<os>[^)\r\n]+)\))?'

  - id: http-nginx-generic
    description: nginx without a version in the Server header.
    protocol: HTTP
    product: nginx
    confidence: 0.8
    priority: 180
    match:
      - type: regex
        pattern: '(?i)(?:^|[\r\n]|\\[rn])Server:\s*nginx\b'

