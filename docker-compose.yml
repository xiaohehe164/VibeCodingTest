# Production-oriented local deployment.
#
# - The API is published on loopback only by default; set
#   BANNER_FINGERPRINT_BIND=0.0.0.0 to expose it deliberately.
# - The client reaches the server by service name over a dedicated internal
#   network ("backend") that has no route to the outside world.
# - Both containers run unprivileged with a read-only root filesystem, all
#   Linux capabilities dropped and no-new-privileges set.
# - The client starts only after the server's live /health check passes.
name: banner-fingerprint

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: "1.0.0"
    image: banner-fingerprint-server:1.0.0
    restart: unless-stopped

    environment:
      LISTEN_ADDR: ":8080"
      RULES_DIR: "/app/rules"
      LOG_LEVEL: "info"
      MAX_BATCH_SIZE: "10000"
      MAX_BODY_BYTES: "16777216"

    # Rules live outside the binary and are mounted read-only, so signatures
    # can be changed and reloaded (SIGHUP) without rebuilding the image.
    volumes:
      - ./rules:/app/rules:ro

    ports:
      - "${BANNER_FINGERPRINT_BIND:-127.0.0.1}:8080:8080"

    networks:
      - edge
      - backend

    healthcheck:
      test: ["CMD", "/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    # Hardening
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=8m,mode=1777

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: banner-fingerprint-client:1.0.0
    restart: "no"

    depends_on:
      server:
        condition: service_healthy

    environment:
      SERVER_URL: "http://server:8080"
      INPUT_FILE: "/data/input.json"
      OUTPUT_FORMAT: "table"

    volumes:
      - ./testdata/input.json:/data/input.json:ro

    networks:
      - backend

    # Hardening
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Public-facing bridge for the deliberately published API port only.
  edge:
    driver: bridge
  # Private, egress-free network used for service-to-service traffic.
  backend:
    driver: bridge
    internal: true
